<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="RocketGuitar - Professional Digital Guitar Tuner">
    <title>RocketGuitar Tuner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="tuner.css">
</head>
<body>
    <!-- Background Effects -->
    <div class="stars"></div>
    <div class="particles-container"></div>

    <!-- Main Mission Control Container -->
    <div class="mission-wrapper">
        <!-- Tuning Selector -->
        <div class="tuning-selector">
            <select id="tuningSelect" class="tuning-dropdown">
                <option value="standard">Standard E (EADGBE)</option>
                <option value="half-step">Half Step Down (Eb Ab Db Gb Bb Eb)</option>
                <option value="dropD">Drop D (DADGBE)</option>
                <option value="dropC">Drop C (CGCFAD)</option>
                <option value="openG">Open G (DGDGBD)</option>
                <option value="openE">Open E (EBEG#BE)</option>
                <option value="dadgad">DADGAD</option>
                <option value="dadfad">Dm (DADFAD)</option>
                <option value="memories">Memories (Eb G D G Bb D)</option>
            </select>
        </div>

        <!-- Mission Control Container -->
        <div class="mission-control">
            <!-- Status Bar -->
            <div class="status-bar">
                <div class="status-indicator">
                    <div class="status-light"></div>
                    <span id="missionStatus">LAUNCH SYSTEMS NOMINAL</span>
                </div>
                <div class="mission-time">
                    T+ <span id="mission-timer">00:00:00</span>
                </div>
            </div>

            <!-- Main Display Panel -->
            <div class="main-display">
                <!-- Tuner Visualization -->
                <div class="tuner-display">
                    <div class="frequency-grid"></div>
                    <div class="center-line"></div>
                    <div class="target-zone"></div>
                    
                    <!-- Tuning Guides -->
                    <div class="tuning-guides">
                        <div class="tuning-guide left-10"></div>
                        <div class="tuning-guide right-10"></div>
                    </div>
                    
                    <!-- Target Crosshair (Fixed Position) -->
                    <div class="target-crosshair">
                        <div class="target-circle"></div>
                        <!-- Inner circle will be added by JavaScript -->
                    </div>
                    
                    <!-- Marker Crosshair (Will Move Based on Frequency) -->
                    <div id="marker" class="marker-crosshair">
                        <div class="marker-circle"></div>
                        <div class="cents-indicator">0¢</div>
                        <!-- Direction indicators will be added by JavaScript -->
                    </div>
                    
                    <div class="signal-monitor">
                        <i data-lucide="activity"></i>
                        <div class="signal-bar">
                            <div id="volumeLevel" class="signal-level"></div>
                        </div>
                    </div>
                </div>

                <!-- Telemetry Readings -->
                <div class="telemetry-grid">
                    <div class="telemetry-box">
                        <div class="telemetry-label">HARMONIC TRAJECTORY</div>
                        <div id="currentNote" class="telemetry-value">-</div>
                    </div>
                    <div class="telemetry-box">
                        <div class="telemetry-label">RESONANCE VECTOR</div>
                        <div id="frequency" class="telemetry-value">-</div>
                    </div>
                </div>

                <!-- Sonic Booster Array -->
                <div class="booster-array">
                    <h2 class="booster-header">
                        <i data-lucide="radio"></i>
                        SONIC BOOSTER ARRAY STATUS
                    </h2>
                    <div class="booster-grid" id="stringGrid">
                        <!-- String items will be dynamically added here by JavaScript -->
                    </div>
                </div>

                <!-- Mission Control Actions -->
                <div class="mission-controls">
                    <button id="startButton" class="control-button">
                        <i data-lucide="power"></i>
                        <span id="buttonText">INITIATE LAUNCH SEQUENCE</span>
                    </button>
                    <div id="status" class="mission-feedback">AWAITING ACTIVATION</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Guitar Rocket -->
    <div class="guitar-rocket">
        <svg class="guitar-base" viewBox="0 0 400 800">
            <!-- Keeping existing defs section -->
            <defs>
                <!-- Wood grain pattern -->
                <pattern id="woodgrain" patternUnits="userSpaceOnUse" width="100" height="100">
                    <path d="M0 50 Q 25 45, 50 50 Q 75 55, 100 50" fill="none" stroke="#5c4033" stroke-width="0.5" opacity="0.3"/>
                    <path d="M0 70 Q 25 65, 50 70 Q 75 75, 100 70" fill="none" stroke="#5c4033" stroke-width="0.5" opacity="0.3"/>
                    <path d="M0 90 Q 25 85, 50 90 Q 75 95, 100 90" fill="none" stroke="#5c4033" stroke-width="0.5" opacity="0.3"/>
                </pattern>

                <!-- Flame Gradient -->
                <radialGradient id="flameGradient" cx="0.5" cy="0" r="0.5">
                    <stop offset="0%" stop-color="white"/>
                    <stop offset="20%" stop-color="#fff7d6"/>
                    <stop offset="40%" stop-color="#ffd700"/>
                    <stop offset="60%" stop-color="#ff4500"/>
                    <stop offset="80%" stop-color="#ff0000"/>
                    <stop offset="100%" stop-color="#660000"/>
                </radialGradient>

                <!-- Metal Texture -->
                <pattern id="metalTexture" patternUnits="userSpaceOnUse" width="50" height="50">
                    <rect width="50" height="50" fill="#888"/>
                    <path d="M0 0 L50 50 M50 0 L0 50" stroke="#999" stroke-width="0.5"/>
                </pattern>

                <!-- Smoke Gradient -->
                <radialGradient id="smokeGradient" cx="0.5" cy="0.5" r="0.5">
                    <stop offset="0%" stop-color="rgba(255,255,255,0.8)"/>
                    <stop offset="20%" stop-color="rgba(200,200,200,0.6)"/>
                    <stop offset="40%" stop-color="rgba(150,150,150,0.4)"/>
                    <stop offset="60%" stop-color="rgba(100,100,100,0.3)"/>
                    <stop offset="80%" stop-color="rgba(50,50,50,0.2)"/>
                    <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
                </radialGradient>

                <!-- Enhanced Flame Gradients -->
                <radialGradient id="enhancedCoreFlame" cx="0.5" cy="0.2" r="0.8">
                    <stop offset="0%" stop-color="#ffffff" />
                    <stop offset="20%" stop-color="#fff7e6" />
                    <stop offset="40%" stop-color="#ffdd99" />
                    <stop offset="60%" stop-color="#ff9933" />
                    <stop offset="80%" stop-color="#ff5500" />
                    <stop offset="100%" stop-color="#ff3300" />
                </radialGradient>

                <radialGradient id="enhancedOuterFlame" cx="0.5" cy="0.3" r="0.7">
                    <stop offset="0%" stop-color="#ff6600" />
                    <stop offset="30%" stop-color="#ff3300" />
                    <stop offset="70%" stop-color="#cc0000" />
                    <stop offset="100%" stop-color="#660000" />
                </radialGradient>

                <radialGradient id="enhancedShockDiamond" cx="0.5" cy="0.5" r="0.5">
                    <stop offset="0%" stop-color="#ffffff" />
                    <stop offset="40%" stop-color="#ffdd99" />
                    <stop offset="100%" stop-color="#ff6600" />
                </radialGradient>

                <!-- Add new modern patterns and effects -->
                <!-- Modern Carbon Fiber Pattern -->
                <pattern id="carbonFiber" patternUnits="userSpaceOnUse" width="20" height="20">
                    <rect width="20" height="20" fill="#1a1a1a"/>
                    <path d="M0 0h20v20H0z" fill="none" stroke="#2a2a2a" stroke-width="0.5"/>
                    <circle cx="10" cy="10" r="8" fill="none" stroke="#333" stroke-width="0.3"/>
                    <circle cx="10" cy="10" r="4" fill="none" stroke="#333" stroke-width="0.2"/>
                </pattern>

                <!-- Enhanced Metal Texture -->
                <linearGradient id="brushedMetal" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#444"/>
                    <stop offset="45%" stop-color="#666"/>
                    <stop offset="55%" stop-color="#888"/>
                    <stop offset="100%" stop-color="#555"/>
                </linearGradient>

                <!-- Modern Chrome Effect -->
                <linearGradient id="chromeEffect" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#ffffff"/>
                    <stop offset="45%" stop-color="#f0f0f0"/>
                    <stop offset="55%" stop-color="#d0d0d0"/>
                    <stop offset="100%" stop-color="#a0a0a0"/>
                </linearGradient>

                <!-- Titanium Finish -->
                <linearGradient id="titaniumFinish" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#2c3e50"/>
                    <stop offset="50%" stop-color="#34495e"/>
                    <stop offset="100%" stop-color="#2c3e50"/>
                </linearGradient>

                <!-- Enhanced Flame Effects -->
                <radialGradient id="modernFlame" cx="0.5" cy="0.2" r="0.8">
                    <stop offset="0%" stop-color="#ffffff"/>
                    <stop offset="20%" stop-color="#fff7e6"/>
                    <stop offset="40%" stop-color="#ffdd99"/>
                    <stop offset="60%" stop-color="#ff9933"/>
                    <stop offset="80%" stop-color="#ff5500"/>
                    <stop offset="100%" stop-color="#ff3300"/>
                </radialGradient>
            </defs>

            <!-- Enhanced Rocket Body -->
            <g class="rocket-body">
                <!-- Nose Cone -->
                <path d="M200 50 L160 150 L240 150 Z" fill="url(#metalTexture)"/>
                
                <!-- Main Body (Guitar Shape) -->
                <path class="guitar-body" d="M160 150
                    C 140 200, 140 250, 160 350
                    L 160 600
                    C 160 650, 240 650, 240 600
                    L 240 350
                    C 260 250, 260 200, 240 150
                    Z" fill="#8B4513" stroke="#382a1d" stroke-width="3"/>

                <!-- Fins -->
                <path class="fin left" d="M160 400 L100 600 L160 550 Z" fill="url(#metalTexture)"/>
                <path class="fin right" d="M240 400 L300 600 L240 550 Z" fill="url(#metalTexture)"/>

                <!-- Guitar Features -->
                <g class="guitar-details">
                    <!-- Fretboard -->
                    <rect x="190" y="150" width="20" height="300" fill="#2a1810" stroke="#382a1d"/>
                    <!-- Bridge -->
                    <rect x="180" y="500" width="40" height="10" fill="url(#metalTexture)"/>
                    <!-- Sound Hole -->
                    <circle cx="200" cy="350" r="25" fill="#1a1a1a"/>
                    <!-- Strings -->
                    <g class="strings">
                        <line x1="192" y1="150" x2="192" y2="500" stroke="#silver" stroke-width="1"/>
                        <line x1="195" y1="150" x2="195" y2="500" stroke="#silver" stroke-width="1"/>
                        <line x1="198" y1="150" x2="198" y2="500" stroke="#silver" stroke-width="1"/>
                        <line x1="201" y1="150" x2="201" y2="500" stroke="#silver" stroke-width="1"/>
                        <line x1="204" y1="150" x2="204" y2="500" stroke="#silver" stroke-width="1"/>
                        <line x1="207" y1="150" x2="207" y2="500" stroke="#silver" stroke-width="1"/>
                    </g>
                </g>

                <!-- Engine Section -->
                <g class="engine-section">
                    <!-- Heat Shield -->
                    <path d="M150 600 Q200 620 250 600" fill="url(#titaniumFinish)" class="heat-shield"/>
                    
                    <!-- Enhanced Engine Clusters -->
                    <g class="engine-clusters">
                        <!-- Left Cluster -->
                        <g class="left-cluster">
                            <path d="M160 625 L155 645 Q160 650 165 645 Z" fill="url(#brushedMetal)" class="nozzle"/>
                            <path d="M175 650 L170 670 Q175 675 180 670 Z" fill="url(#brushedMetal)" class="nozzle"/>
                            <path d="M190 675 L185 695 Q190 700 195 695 Z" fill="url(#brushedMetal)" class="nozzle"/>
                            
                            <!-- Cooling System Details -->
                            <path d="M158 625 Q160 635 162 625" fill="none" stroke="url(#chromeEffect)" stroke-width="1" class="cooling-line"/>
                            <path d="M173 650 Q175 660 177 650" fill="none" stroke="url(#chromeEffect)" stroke-width="1" class="cooling-line"/>
                            <path d="M188 675 Q190 685 192 675" fill="none" stroke="url(#chromeEffect)" stroke-width="1" class="cooling-line"/>
                        </g>

                        <!-- Right Cluster (mirror of left) -->
                        <g class="right-cluster">
                            <path d="M240 625 L245 645 Q240 650 235 645 Z" fill="url(#brushedMetal)" class="nozzle"/>
                            <path d="M225 650 L230 670 Q225 675 220 670 Z" fill="url(#brushedMetal)" class="nozzle"/>
                            <path d="M210 675 L215 695 Q210 700 205 695 Z" fill="url(#brushedMetal)" class="nozzle"/>
                            
                            <!-- Cooling System Details -->
                            <path d="M242 625 Q240 635 238 625" fill="none" stroke="url(#chromeEffect)" stroke-width="1" class="cooling-line"/>
                            <path d="M227 650 Q225 660 223 650" fill="none" stroke="url(#chromeEffect)" stroke-width="1" class="cooling-line"/>
                            <path d="M212 675 Q210 685 208 675" fill="none" stroke="url(#chromeEffect)" stroke-width="1" class="cooling-line"/>
                        </g>
                    </g>

                    <!-- Thrust Vectoring Mechanisms -->
                    <g class="thrust-vectoring">
                        <circle cx="160" cy="625" r="3" fill="url(#chromeEffect)" class="gimbal"/>
                        <circle cx="175" cy="650" r="3" fill="url(#chromeEffect)" class="gimbal"/>
                        <circle cx="190" cy="675" r="3" fill="url(#chromeEffect)" class="gimbal"/>
                        <circle cx="240" cy="625" r="3" fill="url(#chromeEffect)" class="gimbal"/>
                        <circle cx="225" cy="650" r="3" fill="url(#chromeEffect)" class="gimbal"/>
                        <circle cx="210" cy="675" r="3" fill="url(#chromeEffect)" class="gimbal"/>
                    </g>
                </g>

                <!-- Smoke Effects -->
                <g class="smoke-effects">
                    <!-- Left Side Smoke -->
                    <g class="left-smoke">
                        <circle cx="160" cy="645" r="10" fill="url(#smokeGradient)" class="smoke-1"/>
                        <circle cx="175" cy="670" r="10" fill="url(#smokeGradient)" class="smoke-2"/>
                        <circle cx="190" cy="695" r="10" fill="url(#smokeGradient)" class="smoke-3"/>
                    </g>
                    <!-- Right Side Smoke -->
                    <g class="right-smoke">
                        <circle cx="240" cy="645" r="10" fill="url(#smokeGradient)" class="smoke-4"/>
                        <circle cx="225" cy="670" r="10" fill="url(#smokeGradient)" class="smoke-5"/>
                        <circle cx="210" cy="695" r="10" fill="url(#smokeGradient)" class="smoke-6"/>
                    </g>
                </g>
            </g>
        </svg>
    </div>

    <!-- Enhanced Launch Complex -->
    <div class="launch-complex">
        <svg viewBox="0 0 1000 600">
            <!-- Definitions for gradients and patterns -->
            <defs>
                <!-- Metal texture for structures -->
                <linearGradient id="metalTexture" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#4a4a4a"/>
                    <stop offset="50%" style="stop-color:#3a3a3a"/>
                    <stop offset="100%" style="stop-color:#2a2a2a"/>
                </linearGradient>
                
                <!-- Grating pattern for platforms -->
                <pattern id="gratingPattern" patternUnits="userSpaceOnUse" width="8" height="8">
                    <rect width="8" height="8" fill="#333"/>
                    <path d="M0 4 H8 M4 0 V8" stroke="#444" stroke-width="1"/>
                </pattern>

                <!-- Concrete texture -->
                <pattern id="concreteTexture" patternUnits="userSpaceOnUse" width="50" height="50">
                    <rect width="50" height="50" fill="#2a2a2a"/>
                    <circle cx="25" cy="25" r="15" fill="#252525"/>
                    <circle cx="0" cy="0" r="15" fill="#252525"/>
                    <circle cx="50" cy="50" r="15" fill="#252525"/>
                </pattern>
            </defs>

            <!-- Main Launch Pad Base -->
            <path d="M100 500 H900 L950 600 H50 Z" fill="url(#concreteTexture)"/>
            
            <!-- Flame Trench -->
            <path d="M400 500 Q500 600 600 500" fill="#1a1a1a" stroke="#222"/>
            <path d="M380 520 Q500 650 620 520" fill="none" stroke="#333" stroke-width="2"/>
            
            <!-- Water Deluge System -->
            <g class="deluge-system">
                <rect x="380" y="510" width="240" height="4" fill="#666"/>
                <circle cx="400" cy="512" r="1" fill="#888" class="nozzle"/>
                <circle cx="450" cy="512" r="1" fill="#888" class="nozzle"/>
                <circle cx="500" cy="512" r="1" fill="#888" class="nozzle"/>
                <circle cx="550" cy="512" r="1" fill="#888" class="nozzle"/>
                <circle cx="600" cy="512" r="1" fill="#888" class="nozzle"/>
            </g>

            <!-- Main Service Tower -->
            <g class="service-tower">
                <!-- Tower Base -->
                <rect x="650" y="100" width="80" height="400" fill="url(#metalTexture)"/>
                
                <!-- Tower Internal Structure -->
                <g class="tower-lattice" stroke="#444" stroke-width="2">
                    <path d="M660 120 L720 140 M660 180 L720 200 M660 240 L720 260" />
                    <path d="M660 300 L720 320 M660 360 L720 380 M660 420 L720 440" />
                </g>

                <!-- Service Arms -->
                <g class="service-arms">
                    <!-- Lower Arm -->
                    <g class="service-arm" transform="translate(650, 350)">
                        <rect width="200" height="20" fill="url(#gratingPattern)"/>
                        <path d="M0 0 L-30 30 M200 0 L230 30" stroke="#555" stroke-width="4"/>
                    </g>
                    
                    <!-- Upper Arm -->
                    <g class="service-arm" transform="translate(650, 250)">
                        <rect width="180" height="20" fill="url(#gratingPattern)"/>
                        <path d="M0 0 L-25 25 M180 0 L205 25" stroke="#555" stroke-width="4"/>
                    </g>
                </g>

                <!-- Tower Lights -->
                <g class="tower-lights">
                    <circle cx="690" cy="150" r="3" fill="red" class="warning-light"/>
                    <circle cx="690" cy="250" r="3" fill="red" class="warning-light"/>
                    <circle cx="690" cy="350" r="3" fill="red" class="warning-light"/>
                </g>
            </g>

            <!-- Lightning Protection System -->
            <g class="lightning-protection">
                <path d="M200 50 L500 200 L800 50" fill="none" stroke="#666" stroke-width="2"/>
                <circle cx="200" cy="50" r="5" fill="#777"/>
                <circle cx="800" cy="50" r="5" fill="#777"/>
            </g>

            <!-- Support Equipment -->
            <g class="ground-equipment">
                <!-- Propellant Lines -->
                <path d="M300 500 Q400 480 400 400" fill="none" stroke="#666" stroke-width="4"/>
                <path d="M700 500 Q600 480 600 400" fill="none" stroke="#666" stroke-width="4"/>
                
                <!-- Connection Points -->
                <circle cx="400" cy="400" r="6" fill="#555"/>
                <circle cx="600" cy="400" r="6" fill="#555"/>
            </g>

            <!-- Hold-down Clamps -->
            <g class="hold-down-clamps">
                <path d="M450 450 L470 500 L480 500 L460 450 Z" fill="#444"/>
                <path d="M550 450 L530 500 L520 500 L540 450 Z" fill="#444"/>
            </g>

            <!-- Sound Suppression Water System -->
            <g class="sound-suppression">
                <rect x="350" y="490" width="300" height="10" fill="#333"/>
                <circle cx="380" cy="495" r="2" fill="#444"/>
                <circle cx="460" cy="495" r="2" fill="#444"/>
                <circle cx="540" cy="495" r="2" fill="#444"/>
                <circle cx="620" cy="495" r="2" fill="#444"/>
            </g>
        </svg>
    </div>

    <!-- Launch Platform -->
    <div class="launch-platform">
        <div class="platform-lights">
            <div class="platform-light"></div>
            <div class="platform-light"></div>
            <div class="platform-light"></div>
        </div>
        <div class="platform-structure">
            <div class="platform-base"></div>
            <div class="support-beams">
                <div class="beam left"></div>
                <div class="beam right"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
